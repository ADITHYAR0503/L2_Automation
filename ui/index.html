<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L2 Automation // Created By Adithya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#09090B',
            surface: '#12121A',
            royal: '#7C3AED',
            violetglow: '#9333EA'
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #09090B;
      color: #FFFFFF;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .panel-card {
      background: linear-gradient(180deg, rgba(22, 22, 34, 0.96) 0%, rgba(15, 15, 24, 0.98) 100%);
      border: 1px solid rgba(124, 58, 237, 0.35);
    }
    .nav-active {
      background: linear-gradient(90deg, #7C3AED 0%, #6D28D9 100%);
      color: #FFFFFF;
    }
    .nav-idle {
      background: #14141F;
      color: #D4D4D8;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .paste-zone:focus {
      outline: 2px solid #9333EA;
      background-color: rgba(124, 58, 237, 0.14);
    }
  </style>
</head>
<body class="min-h-screen bg-obsidian text-white">

  <header class="border-b border-purple-500/30 bg-[#0D0D14] sticky top-0 z-30">
    <div class="max-w-[1480px] mx-auto px-5 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="font-bold tracking-wide text-base sm:text-lg text-white">
        L2 Automation // Created By Adithya
      </div>

      <nav class="flex flex-wrap items-center gap-2">
        <button id="tab-pcm" onclick="switchMainTab('pcm')" class="nav-idle px-3.5 py-2 rounded-lg text-xs font-semibold">PCM Reports</button>
        <button id="tab-health" onclick="switchMainTab('health')" class="nav-idle px-3.5 py-2 rounded-lg text-xs font-semibold">System Health</button>
        <button id="tab-dr2" onclick="switchMainTab('dr2')" class="nav-active px-3.5 py-2 rounded-lg text-xs font-semibold">DR2 Reports</button>
        <button id="tab-alerts" onclick="switchMainTab('alerts')" class="nav-idle px-3.5 py-2 rounded-lg text-xs font-semibold">L2 Alerts</button>
      </nav>
    </div>
  </header>

  <main class="max-w-[1480px] mx-auto px-5 py-5 space-y-4">

    <!-- DR2 REPORTS SECTION -->
    <section id="section-dr2" class="space-y-4">

      <!-- Sub-Report Selector -->
      <div class="panel-card rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap gap-2">
          <button onclick="selectDr2Sub('device_stuck')" id="dr2sub-device_stuck" class="px-3 py-1.5 rounded-md text-xs font-semibold bg-royal text-white">Device Stuck</button>
          <button onclick="selectDr2Sub('app_crash')" id="dr2sub-app_crash" class="px-3 py-1.5 rounded-md text-xs font-medium bg-[#1B1B29] text-zinc-300 border border-white/10">App Crash</button>
          <button onclick="selectDr2Sub('dr2_bftp')" id="dr2sub-dr2_bftp" class="px-3 py-1.5 rounded-md text-xs font-medium bg-[#1B1B29] text-zinc-300 border border-white/10">DR2 BFTP</button>
          <button onclick="selectDr2Sub('dr2_dcu')" id="dr2sub-dr2_dcu" class="px-3 py-1.5 rounded-md text-xs font-medium bg-[#1B1B29] text-zinc-300 border border-white/10">DR2 DCU</button>
          <button onclick="selectDr2Sub('dr2_sftp')" id="dr2sub-dr2_sftp" class="px-3 py-1.5 rounded-md text-xs font-medium bg-[#1B1B29] text-zinc-300 border border-white/10">DR2 SFTP</button>
          <button onclick="selectDr2Sub('dr2_mftp')" id="dr2sub-dr2_mftp" class="px-3 py-1.5 rounded-md text-xs font-medium bg-[#1B1B29] text-zinc-300 border border-white/10">DR2 MFTP</button>
          <button onclick="selectDr2Sub('dr2_mpos')" id="dr2sub-dr2_mpos" class="px-3 py-1.5 rounded-md text-xs font-medium bg-[#1B1B29] text-zinc-300 border border-white/10">DR2 MPOS</button>
          <button onclick="selectDr2Sub('dr2_spos')" id="dr2sub-dr2_spos" class="px-3 py-1.5 rounded-md text-xs font-medium bg-[#1B1B29] text-zinc-300 border border-white/10">DR2 SPOS</button>
          <button onclick="selectDr2Sub('dr2_tpt')" id="dr2sub-dr2_tpt" class="px-3 py-1.5 rounded-md text-xs font-medium bg-[#1B1B29] text-zinc-300 border border-white/10">DR2 TPT</button>
          <button onclick="selectDr2Sub('hhpos_insp')" id="dr2sub-hhpos_insp" class="px-3 py-1.5 rounded-md text-xs font-medium bg-[#1B1B29] text-zinc-300 border border-white/10">HHPOS &amp; Inspection</button>
          <button onclick="selectDr2Sub('sa_tool')" id="dr2sub-sa_tool" class="px-3 py-1.5 rounded-md text-xs font-medium bg-[#1B1B29] text-zinc-300 border border-white/10">SA Tool</button>
        </div>

        <select id="sotiEnv" onchange="renderStuckTable()" class="rounded-lg bg-[#0D0D14] border border-purple-500/40 px-2.5 py-1.5 text-xs text-white">
          <option value="Production" selected>SOTI: Production</option>
          <option value="CTT">SOTI: CTT</option>
          <option value="Preprod">SOTI: Preprod</option>
        </select>
      </div>

      <div id="dr2StagedBanner" class="hidden panel-card rounded-xl p-5">
        <div id="stagedTitle" class="text-sm font-bold text-purple-200"></div>
      </div>

      <!-- DEVICE STUCK -->
      <div id="deviceStuckPanel" class="space-y-4">

        <div class="panel-card rounded-xl p-4 space-y-3">
          <h1 class="text-base font-bold text-white">Device Stuck</h1>

          <!-- Fetch Mail Bar -->
          <div class="flex flex-wrap items-center gap-2">
            <input id="mailTitleInput" type="text"
              placeholder="Paste mail subject or title"
              class="flex-1 min-w-[280px] rounded-lg bg-[#0B0B11] border border-purple-500/40 focus:border-purple-400 focus:outline-none px-3 py-2 text-xs text-white" />
            <button id="btnFetchMail" onclick="fetchMailByTitle()"
              class="px-4 py-2 rounded-lg text-xs font-bold bg-royal hover:bg-violetglow text-white">
              Fetch
            </button>
            <button type="button" onclick="loadSampleRows()"
              class="px-3 py-2 rounded-lg text-xs font-medium bg-[#1B1B29] text-zinc-300 border border-white/10 hover:border-purple-400/50">
              Sample
            </button>
          </div>
          <div id="fetchStatusText" class="text-xs text-purple-300"></div>
        </div>

        <!-- Table + Side Quick Comments -->
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-4 items-start">

          <!-- Main Table (9 cols) -->
          <div class="xl:col-span-9 panel-card rounded-xl p-4 overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-[#1B1B2B] text-purple-200 border-b border-purple-500/30">
                  <th class="p-2.5">Device Name</th>
                  <th class="p-2.5 text-center">Status</th>
                  <th class="p-2.5">Online Duration</th>
                  <th class="p-2.5">SOTI Link</th>
                  <th class="p-2.5 min-w-[190px]">Screen Shot (Optional)</th>
                  <th class="p-2.5 min-w-[260px]">Comments</th>
                </tr>
              </thead>
              <tbody id="stuckTableBody" class="divide-y divide-white/10 bg-[#0D0D14]"></tbody>
            </table>
          </div>

          <!-- Side Quick Comment Buttons (3 cols) -->
          <div class="xl:col-span-3 panel-card rounded-xl p-4 space-y-2">
            <div class="text-xs font-bold text-purple-200">Quick Comments</div>
            <div id="quickCommentButtons" class="flex flex-col gap-2"></div>
          </div>

        </div>

        <!-- Reply Mail Section -->
        <div class="panel-card rounded-xl p-4 space-y-3">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div>
              <label class="block text-[11px] text-zinc-400 mb-1">From</label>
              <input id="emlFrom" type="text" value="adithya.rajeev@accenture.com"
                class="w-full rounded-lg bg-[#0B0B11] border border-white/15 px-3 py-2 text-xs text-white" />
            </div>
            <div>
              <label class="block text-[11px] text-zinc-400 mb-1">To (Editable)</label>
              <input id="emlTo" type="text" value="Presto.PDS.OpsL2Team@accenture.com"
                class="w-full rounded-lg bg-[#0B0B11] border border-white/15 px-3 py-2 text-xs text-white" />
            </div>
            <div>
              <label class="block text-[11px] text-zinc-400 mb-1">CC (Optional)</label>
              <input id="emlCc" type="text" placeholder="Leave blank or add CC..."
                class="w-full rounded-lg bg-[#0B0B11] border border-white/15 px-3 py-2 text-xs text-white" />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-end">
            <div class="md:col-span-2">
              <label class="block text-[11px] text-zinc-400 mb-1">Subject</label>
              <input id="emlSubject" type="text" value=""
                class="w-full rounded-lg bg-[#0B0B11] border border-white/15 px-3 py-2 text-xs text-white" />
            </div>
            <div>
              <label class="block text-[11px] text-zinc-400 mb-1">Thanks &amp; Regards</label>
              <input id="emlRegards" type="text" value="Adithya"
                class="w-full rounded-lg bg-[#0B0B11] border border-white/15 px-3 py-2 text-xs text-white" />
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
            <div id="generateStatusText" class="text-xs text-purple-200"></div>
            <button id="btnGenerateMail" onclick="generateMail()"
              class="px-5 py-2.5 rounded-lg text-xs font-bold bg-royal hover:bg-violetglow text-white">
              Generate Mail
            </button>
          </div>
        </div>

      </div>
    </section>

    <section id="section-pcm" class="hidden panel-card rounded-xl p-6 text-xs text-zinc-300">PCM Reports</section>
    <section id="section-health" class="hidden panel-card rounded-xl p-6 text-xs text-zinc-300">System Health</section>
    <section id="section-alerts" class="hidden panel-card rounded-xl p-6 text-xs text-zinc-300">L2 Alerts</section>

  </main>

  <script>
    const QUICK_COMMENTS = [
      "DCU is in Print Screen, Hence BFTP Android Status 4",
      "DCU is not On Route, Hence BFTP Android Status 4",
      "Both DCU and BFTP Offline in SOTI",
      "DCU Offline in SOTI",
      "DCU is in Login Screen",
      "BFTP Device Recovered, Android Status 1 and in Tap Screen",
      "DCU is in Choose Mode Screen"
    ];

    let currentRows = [];
    let activeCommentRowIdx = null;
    let fetchedEntryId = "";
    let fetchedStoreId = "";
    // rowIndex -> { file, previewUrl, deviceLabel }
    const rowScreenshots = new Map();

    function switchMainTab(tab) {
      ["pcm", "health", "dr2", "alerts"].forEach(k => {
        document.getElementById(`section-${k}`).classList.toggle("hidden", k !== tab);
        document.getElementById(`tab-${k}`).className = k === tab
          ? "nav-active px-3.5 py-2 rounded-lg text-xs font-semibold"
          : "nav-idle px-3.5 py-2 rounded-lg text-xs font-semibold";
      });
    }

    function selectDr2Sub(sub) {
      const subs = ["device_stuck", "app_crash", "dr2_bftp", "dr2_dcu", "dr2_sftp", "dr2_mftp", "dr2_mpos", "dr2_spos", "dr2_tpt", "hhpos_insp", "sa_tool"];
      subs.forEach(s => {
        const el = document.getElementById(`dr2sub-${s}`);
        if (el) {
          el.className = s === sub
            ? "px-3 py-1.5 rounded-md text-xs font-semibold bg-royal text-white"
            : "px-3 py-1.5 rounded-md text-xs font-medium bg-[#1B1B29] text-zinc-300 border border-white/10";
        }
      });
      document.getElementById("deviceStuckPanel").classList.toggle("hidden", sub !== "device_stuck");
      document.getElementById("dr2StagedBanner").classList.toggle("hidden", sub === "device_stuck");
      if (sub !== "device_stuck") {
        document.getElementById("stagedTitle").textContent = sub.replace("_", " ").toUpperCase();
      }
    }

    function renderQuickCommentButtons() {
      const container = document.getElementById("quickCommentButtons");
      container.innerHTML = QUICK_COMMENTS.map((text, idx) => `
        <button type="button" onclick="applyQuickCommentToFocusedRow(${idx})"
          class="text-left p-2.5 rounded-lg bg-[#0E0E16] hover:bg-purple-600/25 border border-white/10 hover:border-purple-400/60 text-xs text-zinc-100 transition">
          ${escapeHtml(text)}
        </button>
      `).join("");
    }

    function applyQuickCommentToFocusedRow(commentIdx) {
      if (activeCommentRowIdx === null || !currentRows[activeCommentRowIdx]) {
        document.getElementById("fetchStatusText").textContent = "Click inside an empty Comments box first, then click a Quick Comment.";
        return;
      }
      const chosen = QUICK_COMMENTS[commentIdx];
      currentRows[activeCommentRowIdx].comments = chosen;
      const inputEl = document.getElementById(`comment-input-${activeCommentRowIdx}`);
      if (inputEl) {
        inputEl.value = chosen;
        inputEl.focus();
      }
    }

    function buildSotiUrl(deviceName, env) {
      const dev = (deviceName || "").trim().toUpperCase();
      const terms = [dev];
      const bftpMatch = dev.match(/^([A-Z0-9]+)_BFTP_([A-Z0-9]+)_(\d+)$/);
      const dcuMatch = dev.match(/^([A-Z0-9]+)_DCU_([A-Z0-9]+)_(\d+)$/);
      if (bftpMatch) terms.push(`${bftpMatch[1]}_DCU_${bftpMatch[2]}_1`);
      else if (dcuMatch) terms.push(`${dcuMatch[1]}_BFTP_${dcuMatch[2]}_2`);

      const query = " " + terms.map(t => `Text AlmostEqual "${t}"`).join(" OR ");
      let base = "https://soti-mobicontrol.prestoprod.net";
      if (env === "CTT") base = "https://soti-mobicontrol.prestoctt.net";
      if (env === "Preprod") base = "https://soti-mobicontrol.prestopreprod.net";
      return `${base}/MobiControl/WebConsole/home/devices?search=${encodeURIComponent(query)}&subGroups=true&count=250`;
    }

    async function fetchMailByTitle() {
      const titleInput = document.getElementById("mailTitleInput").value.trim();
      const statusEl = document.getElementById("fetchStatusText");
      const btn = document.getElementById("btnFetchMail");

      if (!titleInput) {
        statusEl.textContent = "Paste mail subject or title first.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Fetching...";
      statusEl.textContent = "";

      try {
        const res = await fetch(`/api/dr2/device-stuck/fetch-mail?subject=${encodeURIComponent(titleInput)}`);
        const data = await res.json();
        statusEl.textContent = data.message || "";

        if (data.found) {
          fetchedEntryId = data.entry_id || "";
          fetchedStoreId = data.store_id || "";
          document.getElementById("emlSubject").value = data.subject || titleInput;
          rowScreenshots.clear();
          activeCommentRowIdx = null;
          currentRows = (data.rows || []).map(r => ({
            device_name: r.device_name,
            android_device_status: r.android_device_status,
            online_duration: r.online_duration,
            comments: ""
          }));
          renderStuckTable();
        }
      } catch (err) {
        statusEl.textContent = "Unable to connect to Outlook.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Fetch";
      }
    }

    function loadSampleRows() {
      fetchedEntryId = "";
      fetchedStoreId = "";
      rowScreenshots.clear();
      activeCommentRowIdx = null;
      const sampleTitle = "[External] Action Required - Devices Stuck in Status 4 or 5 - 20/11/2026 02:33:00";
      document.getElementById("mailTitleInput").value = sampleTitle;
      document.getElementById("emlSubject").value = sampleTitle;
      currentRows = [
        { device_name: "BRT_BFTP_1701_2", android_device_status: "4", online_duration: "0 Hour(s) 31 Minute(s)", comments: "" },
        { device_name: "DRT_BFTP_6161_2", android_device_status: "4", online_duration: "4 Hour(s) 8 Minute(s)", comments: "" },
        { device_name: "GO_BFTP_2593_2", android_device_status: "4", online_duration: "2 Hour(s) 33 Minute(s)", comments: "" }
      ];
      renderStuckTable();
    }

    function setRowScreenshot(rowIdx, file) {
      if (!file) return;
      const dev = currentRows[rowIdx]?.device_name || `Device_${rowIdx + 1}`;
      rowScreenshots.set(rowIdx, {
        file,
        previewUrl: URL.createObjectURL(file),
        deviceLabel: dev
      });
      renderStuckTable();
    }

    function handlePasteScreenshot(e, rowIdx) {
      const items = e.clipboardData?.items || [];
      for (const item of items) {
        if (item.type && item.type.startsWith("image/")) {
          e.preventDefault();
          const file = item.getAsFile();
          setRowScreenshot(rowIdx, file);
          return;
        }
      }
    }

    function removeRowScreenshot(rowIdx) {
      rowScreenshots.delete(rowIdx);
      renderStuckTable();
    }

    function renderScreenshotCell(rowIdx) {
      const shot = rowScreenshots.get(rowIdx);
      if (shot) {
        return `
          <div class="space-y-1">
            <img src="${shot.previewUrl}" alt="${escapeAttr(shot.deviceLabel)}" class="h-14 w-auto rounded border border-purple-400/50 object-contain bg-black" />
            <button type="button" onclick="removeRowScreenshot(${rowIdx})" class="text-[11px] text-red-300 hover:underline">Remove</button>
          </div>
        `;
      }
      return `
        <div class="space-y-1.5">
          <div tabindex="0" onpaste="handlePasteScreenshot(event, ${rowIdx})"
            class="paste-zone rounded border border-dashed border-purple-500/40 bg-[#0A0A10] px-2.5 py-2 text-[11px] text-zinc-400 cursor-pointer select-none">
            Click &amp; Ctrl+V SS
          </div>
          <label class="inline-block text-[11px] text-purple-300 hover:text-white cursor-pointer underline">
            or Upload
            <input type="file" accept="image/png,image/jpeg,image/webp" class="hidden"
              onchange="setRowScreenshot(${rowIdx}, this.files[0])" />
          </label>
        </div>
      `;
    }

    function renderStuckTable() {
      const tbody = document.getElementById("stuckTableBody");
      const env = document.getElementById("sotiEnv").value;

      if (!currentRows.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-zinc-400">Paste mail subject above and click <strong>Fetch</strong>.</td></tr>`;
        return;
      }

      tbody.innerHTML = currentRows.map((row, idx) => {
        const sotiUrl = buildSotiUrl(row.device_name, env);
        const pairLabel = row.device_name.includes("_BFTP_")
          ? `${row.device_name} + DCU`
          : row.device_name;

        return `
          <tr>
            <td class="p-2.5 font-mono font-semibold text-white">${escapeHtml(row.device_name)}</td>
            <td class="p-2.5 text-center font-semibold text-white">${escapeHtml(row.android_device_status)}</td>
            <td class="p-2.5 text-zinc-200">${escapeHtml(row.online_duration)}</td>
            <td class="p-2.5">
              <a href="${escapeAttr(sotiUrl)}" target="_blank" rel="noopener noreferrer"
                 class="text-purple-300 hover:text-white underline text-xs font-medium">
                Open SOTI (${escapeHtml(pairLabel)})
              </a>
            </td>
            <td class="p-2.5">${renderScreenshotCell(idx)}</td>
            <td class="p-2.5">
              <input id="comment-input-${idx}" type="text" value="${escapeAttr(row.comments)}"
                placeholder="Click here then click Quick Comment"
                onfocus="activeCommentRowIdx = ${idx}"
                oninput="currentRows[${idx}].comments = this.value"
                class="w-full rounded bg-[#141420] border border-white/15 focus:border-purple-400 focus:outline-none px-2.5 py-2 text-xs text-white" />
            </td>
          </tr>
        `;
      }).join("");
    }

    async function generateMail() {
      if (!currentRows.length) return;
      const btn = document.getElementById("btnGenerateMail");
      const statusEl = document.getElementById("generateStatusText");
      btn.disabled = true;
      btn.textContent = "Generating...";
      statusEl.textContent = "";

      try {
        const formData = new FormData();
        formData.append("sender", document.getElementById("emlFrom").value);
        formData.append("to_addr", document.getElementById("emlTo").value);
        formData.append("cc_addr", document.getElementById("emlCc").value);
        formData.append("subject", document.getElementById("emlSubject").value);
        formData.append("regards_name", document.getElementById("emlRegards").value);
        formData.append("entry_id", fetchedEntryId);
        formData.append("store_id", fetchedStoreId);
        formData.append("rows_json", JSON.stringify(currentRows));

        rowScreenshots.forEach((shot) => {
          formData.append("screenshot_labels", shot.deviceLabel);
          formData.append("screenshots", shot.file, `${shot.deviceLabel.replace(/[^A-Za-z0-9_-]/g, "_")}.png`);
        });

        const res = await fetch("/api/dr2/device-stuck/generate-mail", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to generate mail.");
        statusEl.textContent = data.detail || "Draft opened in Outlook.";
      } catch (err) {
        statusEl.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate Mail";
      }
    }

    function escapeHtml(v) {
      return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeAttr(v) {
      return escapeHtml(v).replace(/'/g, "&#39;");
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderQuickCommentButtons();
      renderStuckTable();
    });
  </script>
</body>
</html>
